name: Build and Release TV-Watcher

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Frontend
        run: npx vite build

      - name: Build Electron App
        uses: electron-userland/electron-builder-action@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: true
          mac_config: package.json
          win_config: package.json
